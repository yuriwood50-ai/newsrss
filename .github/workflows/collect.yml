name: Collect RSS

on:
  schedule:
    - cron: "0 */2 * * *" # 2시간마다 (UTC 기준)
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: node scripts/collect.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git add data/news.json
            git commit -m "chore: RSS 자동 수집 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
